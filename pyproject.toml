[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "herbie-platform"
version = "0.1.0"
description = "Multi-tenant cloud EV charging management platform"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "H.E.R.B.I.E. project team" },
]
dependencies = [
  "fastapi>=0.119,<1",
  "pydantic-settings>=2.11,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[project.scripts]
herbie-api = "herbie.main:run"
herbie-simulator = "herbie_simulator.cli:run"
herbie-worker = "herbie.worker:run"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/herbie", "simulator/src/herbie_simulator"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=herbie --cov=herbie_simulator --cov-report=term-missing"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["backend/src", "simulator/src"]
testpaths = ["backend/tests", "simulator/tests"]

[tool.coverage.run]
branch = true
source = ["herbie", "herbie_simulator"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "backend/tests", "simulator/src", "simulator/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src", "backend/tests", "simulator/src", "simulator/tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
